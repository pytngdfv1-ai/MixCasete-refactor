plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mixcasete.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mixcasete.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}

dependencies {
    // Extractor de YouTube (devuelve la URL de audio).
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:dev-SNAPSHOT'

    // Reproductor robusto: soporta Opus/WebM, cabeceras personalizadas,
    // y maneja URLs de googlevideo mucho mejor que MediaPlayer nativo.
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
}
